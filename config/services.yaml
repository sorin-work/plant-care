parameters:
    app.version: '0.9.0'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

when@test:
    services:
        App\Tests\Support\Doctrine\QueryCounter:
            tags: [doctrine.middleware]
